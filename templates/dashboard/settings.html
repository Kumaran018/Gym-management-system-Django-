{% extends 'base.html' %}

{% block title %}System Settings - Muscle Fit Gym{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0"><i class="fa-solid fa-sliders text-primary me-2"></i>System Settings</h2>
                <p class="text-muted m-0 small">Customize gym credentials, contact information, and operation timings.</p>
            </div>
        </div>

        <div class="card card-premium border-0 shadow-sm p-4">
            <h4 class="fw-bold mb-4">
                <i class="fa-solid fa-hotel text-primary me-2"></i>Gym Identity & Configurations
            </h4>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label font-weight-bold text-muted small">Gym Name</label>
                    <input type="text" name="gym_name" class="form-control" value="{{ config.gym_name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label font-weight-bold text-muted small">Street Address</label>
                    <input type="text" name="address" class="form-control" value="{{ config.address }}" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label font-weight-bold text-muted small">Support Email</label>
                        <input type="email" name="email" class="form-control" value="{{ config.email }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label font-weight-bold text-muted small">Support Phone</label>
                        <input type="text" name="phone" class="form-control" value="{{ config.phone }}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label font-weight-bold text-muted small">Operating Timings (Opening Hours)</label>
                    <input type="text" name="hours" class="form-control" value="{{ config.hours }}" required>
                </div>

                <div class="border-top pt-4 mt-4 text-end">
                    <button type="submit" class="btn btn-premium px-5">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Save Configuration
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
