{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle n Fitness - Gym Catalog</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=4.0">
    <style>
        body {
            background-color: #0b0d10 !important;
            color: #f3f4f6 !important;
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }
        .card, .card-premium {
            background-color: #15181e !important;
            border: 1px solid rgba(255, 255, 255, 0.07) !important;
            color: #f3f4f6 !important;
        }
    </style>
</head>
<body>
    <!-- Public Guest Header -->
    <nav class="navbar navbar-expand-lg navbar-dark py-3 px-4" style="background: #0f1217; border-bottom: 1px solid rgba(255, 255, 255, 0.07);">
        <div class="container px-4">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2 text-white text-decoration-none" href="{% url 'core:home' %}">
                <i class="fa-solid fa-dumbbell" style="color: #bdf72b;"></i>
                <span>Muscle n <span style="color: #bdf72b;">Fitness</span></span>
            </a>
            <div class="collapse navbar-collapse justify-content-end" id="guestNavbar">
                <ul class="navbar-nav align-items-center gap-3">
                    <li class="nav-item">
                        <a href="{% url 'core:home' %}" class="btn-dark-pill btn-sm px-3 py-2">Home Hub</a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'authentication:login' %}" class="btn-lime btn-sm px-4 py-2">
                            <i class="fa-solid fa-right-to-bracket me-1"></i> Staff/Member Sign In
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container py-5 px-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Public Footer -->
    <footer class="text-center py-4 border-top" style="background: #0b0d10; border-color: rgba(255, 255, 255, 0.07) !important;">
        <div class="container">
            <span class="small text-muted">&copy; 2026 Muscle n Fitness Gym Management System.</span>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
