<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle Fit Gym - General Catalog</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">
    <!-- Public Guest Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 shadow-sm">
        <div class="container px-4">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="#">
                <i class="fa-solid fa-dumbbell text-sky-400"></i>Muscle Fit Gym
            </a>
            <div class="collapse navbar-collapse justify-content-end" id="guestNavbar">
                <ul class="navbar-nav align-items-center gap-3">
                    <li class="nav-item">
                        <a href="{% url 'authentication:login' %}" class="btn btn-primary btn-sm px-4 py-2 rounded-pill fw-semibold shadow-sm"><i class="fa-solid fa-right-to-bracket me-2"></i>Staff/Member Sign In</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container py-5 px-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Public Footer -->
    <footer class="bg-dark text-white text-center py-4 border-top border-secondary-subtle">
        <div class="container">
            <span class="small text-muted">&copy; 2026 Muscle Fit Gym. Open to all fitness enthusiasts.</span>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
